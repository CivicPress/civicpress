name: dependency-review

# Supply-chain gate: on every PR targeting an integration branch, review the
# dependency changes the PR introduces and fail if a newly added/updated package
# carries a known HIGH-or-worse vulnerability. Relies on the repository's
# Dependency Graph (enabled by default for public repositories). Complements
# Renovate (which opens the dep-bump PRs this then vets) and the osv-scanner
# workflow (which scans the whole lockfile on a schedule, not just the PR diff).

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write # post the review summary comment

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
