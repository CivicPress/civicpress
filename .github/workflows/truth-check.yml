name: audit-truth-check

# Phase 2c Task 16: CI integration of the audit-truth-check gate.
#
# The gate (see `scripts/audit-truth-check.sh` + Makefile target) scans
# the working tree for documented overclaim patterns ("production-ready",
# "100% Functional", "Top 0.1%", "stable v1.0", "All goals completed",
# etc.) and exits non-zero if any are found outside the allow-list.
#
# Phase 2b built the script + Makefile target as a manual gate. This
# workflow makes it recurring so future PRs can't silently regress
# the structural-dishonesty patterns the 2026-05 audit named.
#
# Runs on EVERY pull request, and on every push to main/develop (the
# integration branches the refactor merges through).
#
# It used to carry a `paths:` filter on `pull_request` — docs/, the gate
# scripts, this workflow, Makefile — on the reasoning that overclaim language
# only enters through those. That was true of the language but wrong as a CI
# contract, because `truth-check` is a REQUIRED status check in the `main`
# ruleset (id 19597452, active since 2026-07-23, alongside `build-test`).
# A required context that a paths filter can skip is a deadlock: the PR waits
# forever for a check that will never report. Confirmed against history — PR
# #24 touched none of those paths and has no `truth-check` context at all, so
# an equivalent PR today could never merge to main.
#
# Removing the filter is the cheap end of the fix: the job is a shell scan
# that finishes in about ten seconds, so running it on every PR costs nothing
# worth protecting. The alternatives (a skip-job reporting the same context,
# or dropping it from the required set) both add moving parts to save that.
on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  truth-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # SHA-pinned to the same actions/checkout v6 (Node 24) as ci.yml — the
        # bare v4 tag here ran on the sunset Node 20 and annotated every run.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Run audit-truth-check
        run: make audit-truth-check
