channels:
  email:
    enabled: true
    provider: 'smtp'

    # SendGrid Configuration (disabled for tests)
    sendgrid:
      apiKey: ''
      from: 'test@example.com'

    # SMTP Configuration — used for tests
    smtp:
      host: 'smtp.test.com'
      port: 587
      secure: false
      auth:
        user: 'test@example.com'
        pass: 'password'
      from: 'test@example.com'

    replyTo: null
  sms:
    enabled: false
    provider: 'twilio'
    credentials: {}
  slack:
    enabled: false
    webhook_url: ''
    channel: null
    username: null
auth_templates:
  email_verification:
    subject: 'Verify your CivicPress account'
    body:
      "Please click the following link to verify your
      account:\n{{verification_url}}"
  email_change_verification:
    subject: 'Verify your new CivicPress email address'
    body:
      "Please click the following link to verify your new email
      address:\n{{verification_url}}"
  password_reset:
    subject: 'Reset your CivicPress password'
    body: "Reset your password here:\n{{reset_url}}"
rules:
  rate_limits:
    email_per_hour: 100
    sms_per_hour: 50
    slack_per_hour: 200
security:
  encrypt_sensitive_data: true
  audit_all_notifications: true
  filter_pii: true
