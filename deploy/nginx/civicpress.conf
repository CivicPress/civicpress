# CivicPress reverse proxy — unifies UI + API + realtime on one origin and
# terminates TLS. Corrected port model: API=3000, UI=3030 (the deployment.md
# spec's table is inverted).
#
# TLS: put fullchain.pem + privkey.pem in deploy/certs/ (e.g. from certbot) and
# uncomment the 443 server. The HTTP/:80 server is for a quick LOCAL test only —
# do NOT expose it publicly: a broadcast-box device refuses to enroll over
# cleartext to a non-loopback host (needs real wss://).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream civic_api { server api:3000; }
upstream civic_rt  { server api:3001; }
upstream civic_ui  { server ui:3030; }

# Shared proxy locations (kept in one place so :80 and :443 stay in sync).
# In each server block below, `include` this is not used; blocks are duplicated
# for clarity and to keep a single-file drop-in.

server {
  listen 80;
  server_name _;

  # The API sets its own security headers via helmet; add them for the UI
  # origin too.
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 512m;   # broadcast-box chunked uploads

  location /api/ {
    proxy_pass http://civic_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /realtime {
    proxy_pass http://civic_rt;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://civic_ui;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

