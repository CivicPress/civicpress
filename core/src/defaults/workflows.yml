# Workflow Configuration
# This file defines record statuses, transitions, and the roles allowed to move
# records between them.
#
# SCOPE — this file governs STATUS TRANSITIONS only. Who may create, edit,
# delete or view a record is `roles.yml`, enforced through `userCan` /
# RoleManager across the API. That is the authority; do not add can_edit /
# can_delete / can_view here expecting them to take effect.
#
# Those three keys used to ship in this file and were read by nothing (swept
# 2026-08-11). `can_view` was the misleading one: it looked like it controlled
# what the public could see, while actual public visibility is decided by the
# `public` flag on each record status — fail-closed, and independent of this
# file. `can_create` is still honoured, but only by the `civic create` CLI
# command; the API gates creation through roles.yml like everything else.

_metadata:
  name: 'Workflow & Status Management'
  description: 'Define record statuses, transitions, and role-based permissions'
  version: '1.0.0'
  editable: true

# Available Record Statuses
statuses:
  value:
    - draft
    - proposed
    - reviewed
    - approved
    - archived
  type: 'array'
  description: 'Available record statuses in the system'
  required: true

# Status Transitions (what statuses can transition to what)
transitions:
  draft:
    value:
      - proposed
      - archived
    type: 'array'
    description: 'Statuses that draft can transition to'
    required: true
  proposed:
    value:
      - reviewed
      - archived
    type: 'array'
    description: 'Statuses that proposed can transition to'
    required: true
  reviewed:
    value:
      - approved
      - archived
    type: 'array'
    description: 'Statuses that reviewed can transition to'
    required: true
  approved:
    value:
      - archived
    type: 'array'
    description: 'Statuses that approved can transition to'
    required: true
  archived:
    value: []
    type: 'array'
    description: 'Statuses that archived can transition to (usually none)'
    required: true

# Role-Based Permissions
roles:
  admin:
    can_create:
      value:
        - bylaw
        - policy
        - resolution
        - proclamation
        - ordinance
      type: 'array'
      description: 'Record types admin can create'
      required: true
    can_transition:
      draft:
        value: [proposed, archived]
        type: 'array'
        description: 'Statuses admin can transition draft records to'
        required: true
      proposed:
        value: [reviewed, archived]
        type: 'array'
        description: 'Statuses admin can transition proposed records to'
        required: true
      reviewed:
        value: [approved, archived]
        type: 'array'
        description: 'Statuses admin can transition reviewed records to'
        required: true
      approved:
        value: [archived]
        type: 'array'
        description: 'Statuses admin can transition approved records to'
        required: true
      any:
        value: [archived]
        type: 'array'
        description: 'Statuses admin can transition any record to'
        required: true

  clerk:
    can_create:
      value:
        - bylaw
        - policy
        - resolution
      type: 'array'
      description: 'Record types clerk can create'
      required: true
    can_transition:
      draft:
        value: [proposed]
        type: 'array'
        description: 'Statuses clerk can transition draft records to'
        required: true

  # Kept as an explicit empty transition set rather than dropped entirely: the
  # role must still resolve here, or `validateTransition` reports "role not
  # found" instead of "this role may not make that transition".
  public:
    can_transition: {}
