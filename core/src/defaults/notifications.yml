# Notifications Configuration
# This file configures notification channels, providers, and settings

_metadata:
  name: 'Notification System'
  description:
    'Configure notification channels, providers, and delivery settings'
  version: '1.0.0'
  editable: true

# Notification Channels Configuration
channels:
  email:
    enabled:
      value: false
      type: 'boolean'
      description: 'Enable email notifications'
      required: true
    provider:
      value: 'smtp'
      type: 'array'
      options:
        [
          { value: 'smtp', label: 'SMTP Server' },
          { value: 'sendgrid', label: 'SendGrid' },
        ]
      description: 'Transport used for every email: an SMTP relay, or SendGrid'
      required: true

    # SendGrid Configuration
    sendgrid:
      apiKey:
        value: ''
        type: 'string'
        description: 'SendGrid API key'
        required: false
      from:
        value: 'noreply@civicpress.local'
        type: 'string:email'
        description: 'Default sender email address'
        required: true

    # SMTP Configuration
    smtp:
      host:
        value: 'localhost'
        type: 'string'
        description: 'SMTP server hostname'
        required: true
      port:
        value: 587
        type: 'number'
        description: 'SMTP server port'
        required: true
      secure:
        value: false
        type: 'boolean'
        description: 'Use secure connection (TLS)'
        required: true
      auth:
        user:
          value: ''
          type: 'string'
          description: 'SMTP username'
          required: false
        pass:
          value: ''
          type: 'string'
          description: 'SMTP password'
          required: false
      from:
        value: 'noreply@civicpress.local'
        type: 'string:email'
        description: 'Default sender email address'
        required: true
      tls:
        rejectUnauthorized:
          value: true
          type: 'boolean'
          description: 'Reject unauthorized (invalid/self-signed) certificates'
          required: true

    replyTo:
      value: null
      type: 'string:email'
      description: 'Reply-To address on every outgoing email (empty: none)'
      required: false

  sms:
    enabled:
      value: false
      type: 'boolean'
      description: 'Enable SMS notifications'
      required: true
    provider:
      value: 'twilio'
      type: 'string'
      description: 'SMS service provider'
      required: true
    credentials:
      value: {}
      type: 'object'
      description: 'Provider-specific credentials'
      required: false

  slack:
    enabled:
      value: false
      type: 'boolean'
      description: 'Enable Slack notifications'
      required: true
    webhook_url:
      value: ''
      type: 'string:url'
      description: 'Slack webhook URL'
      required: false
    channel:
      value: null
      type: 'string'
      description: 'Default Slack channel'
      required: false
    username:
      value: null
      type: 'string'
      description: 'Bot username for Slack messages'
      required: false

# Authentication Email Templates
#
# Subject and body of the emails the authentication flows send. Placeholders
# are written {{name}}; each email provides the ones listed with it, and the
# body must keep the link placeholder — a template that drops it, or uses a
# placeholder the email does not provide, is replaced by the built-in text
# and a warning is logged.
auth_templates:
  # Provides: {{verification_url}}, {{token}}, {{expires_at}}
  email_verification:
    subject:
      value: 'Verify your CivicPress account'
      type: 'string'
      description: 'Email verification subject line'
      required: true
    body:
      value:
        "Please click the following link to verify your
        account:\n{{verification_url}}"
      type: 'string:textarea'
      description: 'Email verification body (must contain {{verification_url}})'
      required: true
  # Provides: {{verification_url}}, {{token}}, {{expires_at}}
  email_change_verification:
    subject:
      value: 'Verify your new CivicPress email address'
      type: 'string'
      description: 'Email-change verification subject line'
      required: true
    body:
      value:
        "Please click the following link to verify your new email
        address:\n{{verification_url}}"
      type: 'string:textarea'
      description:
        'Email-change verification body (must contain {{verification_url}})'
      required: true
  # Provides: {{reset_url}}, {{username}}
  password_reset:
    subject:
      value: 'Reset your CivicPress password'
      type: 'string'
      description: 'Password reset subject line'
      required: true
    body:
      value:
        "A password reset was requested for your CivicPress account
        \"{{username}}\".\n\nReset your password here:\n{{reset_url}}\n\nThis
        link can be used once and expires in 1 hour. If you did not request
        this, you can safely ignore this message — your password will not
        change."
      type: 'string:textarea'
      description: 'Password reset body (must contain {{reset_url}})'
      required: true

# Notification Rules and Limits
rules:
  rate_limits:
    email_per_hour:
      value: 100
      type: 'number'
      description: 'Maximum emails per hour'
      required: true
    sms_per_hour:
      value: 50
      type: 'number'
      description: 'Maximum SMS per hour'
      required: true
    slack_per_hour:
      value: 200
      type: 'number'
      description: 'Maximum Slack messages per hour'
      required: true
# Security Settings
security:
  encrypt_sensitive_data:
    value: true
    type: 'boolean'
    description:
      'Encrypt the operator-inbox body and data at rest (AES-256-GCM, key
      derived from the instance secret); rows written before are sealed on next
      start'
    required: true
  audit_all_notifications:
    value: true
    type: 'boolean'
    description:
      'Write every send attempt to the unified audit trail — channels, template,
      outcome and a hash of the recipient, never the message'
    required: true
  filter_pii:
    value: true
    type: 'boolean'
    description:
      'Redact email addresses, phone numbers and similar from what is stored —
      the notification audit log and operator-inbox rows — not from the messages
      sent'
    required: true
